# Backend
backend = "glx";

# VSync
vsync = true;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 2;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.2;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'slop'",
  "class_g = 'dmenu'",
  "name = 'Notification'",
  "class_g ?= 'Conky'"
];

# Transparency
inactive-opacity = 0.92;
active-opacity = 0.99;
frame-opacity = 0.7;

# Blur (optional, only if you want it and have picom-ibhagwan)
# blur-method = "dual_kawase";
# blur-strength = 7;

# Corner rounding (only with ibhagwan fork)
# corner-radius = 10;

# Experimental
use-damage = true;
